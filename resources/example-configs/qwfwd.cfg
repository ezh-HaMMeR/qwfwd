// This is the default QWFWD configuration file
// Feel free to change parameters to your liking

// Hostname shown to connecting clients in-game
set hostname QWFWD

// Domain (or ip) and port number
// set hostport "example.com:30000"

// Geographical info
// set countrycode "se"
// set city "Stockholm"
// set coords "59.3327,18.0656"

// UDP port on which QWFWD will listen for client, default port is 30000
// set net_port 30000

// Optional list of UDP ports or ranges. When set, this replaces net_port.
// set net_ports "27500 27501 27600-27610"

// IP address on which QWFWD will listen for client, default is all host IP addresses
// set net_ip X.X.X.X

// Server used when a client connects directly without a prx userinfo key.
// Without an explicit destination port, the incoming listening port is preserved.
// The connection is still proxied through QWFWD.
// set default_server qwtf.net

// Optional per-listening-port destination overrides, separated by spaces.
// set default_server_map "27501=qwtf.net:27502"

// Allow clients to select another destination through the prx userinfo key.
// Set to 0 on a public default-server proxy to restrict it to configured routes.
// set allow_client_prx 0

// Developer mode, default is 0 (0=disabled, 1=enabled)
// set developer 0

// Quakeworld master servers help your QWFWD be found by users
set masters master.quakeworld.nu:27000 qwmaster.fodquake.net:27000 master.quakeservers.net:27000

// Notify master servers when QWFWD is up (0=disabled, 1=enabled)
set masters_heartbeat 1

// Query the master server list (0=disabled, 1=enabled)
set masters_query 1

// Specify a list of QW servers which are not allowed to be queried
set masters_filter_servers 127.0.0.1
